name: One-time Custom Fields native checkbox patch

on:
  push:
    branches: [08-excel-user-interface]
    paths:
      - '.github/workflows/patch-custom-fields-native-checkbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08-excel-user-interface
          fetch-depth: 0
      - name: Patch Custom Fields VBA to native in-cell checkboxes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('excel/vba/modNMDC_CustomFields.bas')
          text = path.read_text(encoding='utf-8-sig')
          original = text

          old_helper_call = '    NMDC_LiveFilterEnsureHelper master\n'
          if old_helper_call not in text:
              raise SystemExit('Expected obsolete Live Filter helper call was not found')
          text = text.replace(old_helper_call, '', 1)

          clicked_pattern = re.compile(
              r'Public Sub NMDC_CustomCheckboxClicked\(\).*?End Sub\n\nPublic Sub NMDC_SaveCustomFieldConfiguration\(\)',
              re.S,
          )
          clicked_replacement = '''Public Sub NMDC_CustomCheckboxClicked()
              ' Compatibility stub for stale workbooks that still contain a legacy
              ' Form Control checkbox. Fresh builds use native in-cell checkboxes.
              On Error Resume Next
              NMDC_RebuildCustomFieldCheckboxes
              On Error GoTo 0
          End Sub

          Public Sub NMDC_SaveCustomFieldConfiguration()'''
          text, count = clicked_pattern.subn(clicked_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy checkbox-click handler, replaced {count}')

          build_pattern = re.compile(
              r'Private Sub NMDC_CustomBuildCheckboxes\( _\n.*?End Sub\n\nPrivate Sub NMDC_CustomApplyListValidation',
              re.S,
          )
          build_replacement = '''Private Sub NMDC_CustomBuildCheckboxes( _
              ByVal table As ListObject, ByVal enabledColumnName As String, ByVal keyColumnName As String, ByVal prefix As String)

              Dim rowIndex As Long
              Dim targetCell As Range
              Dim keyText As String
              Dim isIncluded As Boolean

              If table.DataBodyRange Is Nothing Then Exit Sub

              For rowIndex = 1 To table.ListRows.Count
                  keyText = Trim$(CStr(table.ListColumns(keyColumnName).DataBodyRange.Cells(rowIndex, 1).Value))
                  Set targetCell = table.ListColumns(enabledColumnName).DataBodyRange.Cells(rowIndex, 1)
                  If Len(keyText) > 0 Then
                      isIncluded = NMDC_CustomCheckedValue(targetCell.Value)
                      targetCell.Value = isIncluded
                      targetCell.NumberFormat = "General"
                      targetCell.HorizontalAlignment = xlCenter
                      On Error Resume Next
                      targetCell.CellControl.SetCheckbox
                      On Error GoTo 0
                  Else
                      targetCell.ClearContents
                  End If
              Next rowIndex
          End Sub

          Private Sub NMDC_CustomApplyListValidation'''
          text, count = build_pattern.subn(build_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy checkbox builder, replaced {count}')

          if 'CheckBoxes.Add' in text:
              raise SystemExit('Legacy CheckBoxes.Add remains after patch')
          if 'NMDC_LiveFilterEnsureHelper' in text:
              raise SystemExit('Obsolete Live Filter helper reference remains after patch')
          if 'CellControl.SetCheckbox' not in text:
              raise SystemExit('Native CellControl.SetCheckbox missing after patch')
          if text == original:
              raise SystemExit('Patch made no changes')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify patch markers
        run: |
          ! grep -q 'CheckBoxes.Add' excel/vba/modNMDC_CustomFields.bas
          ! grep -q 'NMDC_LiveFilterEnsureHelper' excel/vba/modNMDC_CustomFields.bas
          grep -q 'CellControl.SetCheckbox' excel/vba/modNMDC_CustomFields.bas
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'ChatGPT Release Coordinator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-custom-fields-native-checkbox.yml
          git add excel/vba/modNMDC_CustomFields.bas
          git commit -m 'Finish native checkbox implementation in Custom Fields'
          git push origin HEAD:08-excel-user-interface

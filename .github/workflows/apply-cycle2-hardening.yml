name: Apply Cycle 2 hardening patch

on:
  push:
    branches:
      - feature/cycle2-sentinel-extractor
    paths:
      - tools/apply_cycle2_hardening.py
      - tools/run_cycle2_hardening.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply hardening patch
        run: python tools/apply_cycle2_hardening.py

      - name: Compile
        run: python -m compileall -q profiler.py sentinel_extract.py nmdc_profiler tests

      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -v

      - name: Run real sentinel extraction
        run: python sentinel_extract.py

      - name: Verify real DATA semantics
        run: python tests/verify_cycle2_real_data.py

      - name: Confirm DATA unchanged
        run: |
          if ! git diff --quiet -- DATA; then
            git diff -- DATA
            exit 1
          fi

      - name: Commit hardened source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nmdc_profiler/extractor.py tests/test_extractor.py tests/verify_cycle2_real_data.py
          if git diff --cached --quiet; then
            echo 'No hardening changes to commit.'
          else
            git commit -m 'fix: harden reversed multi-row event headers [skip ci]'
            git push
          fi

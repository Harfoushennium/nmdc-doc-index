name: NMDC V2 standalone candidate
on:
  pull_request:
    branches: [planning/nmdc-v2-standalone, feature/nmdc-v2-web-app, feature/nmdc-v2-antigravity-neon, review/nmdc-v2-codex-rc1]
  workflow_dispatch:
concurrency:
  group: nmdc-v2-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  legacy-engine-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V2 test dependencies
        run: python -m pip install xlsxwriter==3.2.9 playwright==1.56.0
      - name: V2 public workflow regressions
        run: python -m unittest discover -s v2 -p 'test_*.py'
      - name: Full existing regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Source data unchanged
        run: git diff --exit-code -- DATA
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build dependencies (CI only)
        run: python -m pip install pyinstaller==6.16.0 xlsxwriter==3.2.9 playwright==1.56.0
      - name: Full existing regression suite on Windows
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Source smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s v2 -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python v2/launcher.py --self-test
          node --check v2/app.js
          python -c "from pathlib import Path; [p.read_text(encoding='utf-8') for p in Path('v2').iterdir() if p.suffix in ('.py','.js','.html','.md','.ps1')]"
      - name: Windows standalone build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name Launch --paths . --add-data "v2/index.html;v2" --add-data "v2/app.js;v2" --add-data "v2/style.css;v2" --add-data "config/classification_rules.csv;config" --add-data "config/project_identity_overrides.csv;config" --add-data "config/source_exclusions.csv;config" v2/launcher.py
          Copy-Item v2/README.md dist/Launch/README.md
      - name: Packaged executable smoke with restricted PATH
        shell: pwsh
        run: |
          $old = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            & .\dist\Launch\Launch.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "Packaged smoke failed: $LASTEXITCODE" }
          } finally { $env:PATH = $old }
      - name: Packaged browser workflow (CI only)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python v2/test_packaged_browser.py dist/Launch/Launch.exe
      - name: Packaged full scan and verified unchanged workflow
        shell: pwsh
        timeout-minutes: 8
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python v2/test_fast_path.py dist/Launch/Launch.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- DATA
      - uses: actions/upload-artifact@v4
        with:
          name: NMDC-V2-fast-path-metrics
          path: v2-fast-path-metrics.json
          if-no-files-found: error
      - name: Verified portable RC1 package
        shell: pwsh
        run: |
          python v2/package_rc.py dist/Launch NMDC_V2_RC1_Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NMDC-V2-Standalone-Candidate-Windows
          path: |
            NMDC_V2_RC1_Windows.zip
            NMDC_V2_RC1_Windows.zip.sha256
          if-no-files-found: error
  read-only-corpus-benchmark:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependency (CI only)
        run: python -m pip install xlsxwriter==3.2.9
      - name: Run read-only corpus diagnostic
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python v2/benchmark_corpus.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('v2-corpus-benchmark.json')); assert r['status']=='MEASURED' and r['incremental_output_parity'] and r['source_hashes_unchanged'] and r['xlsx_structural']=='PASS'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- DATA
      - uses: actions/upload-artifact@v4
        with:
          name: NMDC-V2-corpus-benchmark-metrics
          path: v2-corpus-benchmark.json
          if-no-files-found: error

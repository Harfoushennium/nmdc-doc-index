name: Cycle 3 full extraction validation

on:
  push:
    branches:
      - feature/cycle3-full-extraction
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile project
        run: python -m compileall -q profiler.py sentinel_extract.py full_extract.py nmdc_profiler tests

      - name: Refresh Cycle 1 evidence
        run: python profiler.py

      - name: Preserve Cycle 2 sentinel baseline
        run: |
          python sentinel_extract.py
          python tests/verify_cycle2_real_data.py

      - name: Run Cycle 3 full extraction
        run: python full_extract.py

      - name: Capture first Cycle 3 hashes
        run: |
          sha256sum \
            outputs/cycle3/full_records.csv \
            outputs/cycle3/full_reconciliation.json \
            outputs/cycle3/review_queue.csv \
            outputs/cycle3/full_report.md > /tmp/cycle3-first.sha256

      - name: Regenerate Cycle 3 outputs
        run: python full_extract.py

      - name: Verify deterministic Cycle 3 outputs
        run: |
          sha256sum \
            outputs/cycle3/full_records.csv \
            outputs/cycle3/full_reconciliation.json \
            outputs/cycle3/review_queue.csv \
            outputs/cycle3/full_report.md > /tmp/cycle3-second.sha256
          diff -u /tmp/cycle3-first.sha256 /tmp/cycle3-second.sha256

      - name: Verify Cycle 3 against real DATA
        run: python tests/verify_cycle3_real_data.py

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v

      - name: Ensure source DATA was not changed
        run: |
          if ! git diff --quiet -- DATA; then
            echo 'ERROR: extraction changed DATA/'
            git diff -- DATA
            exit 1
          fi

      - name: Ensure no Python runtime artifacts are tracked
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[cod]$)'; then
            echo 'ERROR: Python runtime artifacts must not be tracked.'
            exit 1
          fi

      - name: Ensure Cycle 3 did not create final XLSX
        run: |
          if find . -name 'NMDC_DOCUMENT_INDEX.xlsx' -print -quit | grep -q .; then
            echo 'ERROR: final XLSX is outside Cycle 3 scope.'
            exit 1
          fi

      - name: Commit deterministic Cycle 3 outputs
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/cycle3/full_records.csv outputs/cycle3/full_reconciliation.json outputs/cycle3/review_queue.csv outputs/cycle3/full_report.md
          if git diff --cached --quiet; then
            echo 'Cycle 3 outputs already current.'
          else
            git commit -m 'chore: regenerate Cycle 3 full extraction outputs [skip ci]'
            git push
          fi

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile project
        shell: pwsh
        run: python -m compileall -q profiler.py sentinel_extract.py full_extract.py nmdc_profiler tests

      - name: Refresh Cycle 1 evidence
        shell: pwsh
        run: python profiler.py

      - name: Preserve Cycle 2 sentinel baseline
        shell: pwsh
        run: |
          python sentinel_extract.py
          python tests/verify_cycle2_real_data.py

      - name: Run Cycle 3 full extraction
        shell: pwsh
        run: python full_extract.py

      - name: Capture first Cycle 3 hashes
        shell: pwsh
        run: |
          Get-FileHash outputs/cycle3/full_records.csv -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json -Compress | Set-Content cycle3-first1.txt
          Get-FileHash outputs/cycle3/full_reconciliation.json -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json -Compress | Set-Content cycle3-first2.txt
          Get-FileHash outputs/cycle3/review_queue.csv -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json -Compress | Set-Content cycle3-first3.txt
          Get-FileHash outputs/cycle3/full_report.md -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json -Compress | Set-Content cycle3-first4.txt

      - name: Regenerate Cycle 3 outputs
        shell: pwsh
        run: python full_extract.py

      - name: Verify Windows determinism and LF bytes
        shell: pwsh
        run: |
          $pairs = @(
            @('outputs/cycle3/full_records.csv','cycle3-first1.txt'),
            @('outputs/cycle3/full_reconciliation.json','cycle3-first2.txt'),
            @('outputs/cycle3/review_queue.csv','cycle3-first3.txt'),
            @('outputs/cycle3/full_report.md','cycle3-first4.txt')
          )
          foreach ($pair in $pairs) {
            $current = (Get-FileHash $pair[0] -Algorithm SHA256).Hash
            $previous = ((Get-Content $pair[1] | ConvertFrom-Json).Hash)
            if ($current -ne $previous) { throw "Non-deterministic output: $($pair[0])" }
            $bytes = [System.IO.File]::ReadAllBytes($pair[0])
            for ($i=0; $i -lt $bytes.Length-1; $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i+1] -eq 10) { throw "CRLF found: $($pair[0])" }
            }
          }
          Write-Host 'Windows deterministic LF Cycle 3 outputs: PASS'

      - name: Verify Cycle 3 against real DATA
        shell: pwsh
        run: python tests/verify_cycle3_real_data.py

      - name: Run complete regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Ensure source DATA was not changed
        shell: pwsh
        run: |
          git diff --quiet -- DATA
          if ($LASTEXITCODE -ne 0) {
            git diff -- DATA
            throw 'Extraction changed DATA/'
          }

      - name: Ensure Cycle 3 did not create final XLSX
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse -Filter NMDC_DOCUMENT_INDEX.xlsx -ErrorAction SilentlyContinue
          if ($found) { throw 'Final XLSX is outside Cycle 3 scope.' }

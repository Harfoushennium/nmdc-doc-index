name: Diagnose Cycle 3 review layouts

on:
  push:
    branches:
      - feature/cycle3-full-extraction
    paths:
      - tools/diagnose_cycle3_reviews.py
      - .github/workflows/diagnose-cycle3.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/diagnose_cycle3_reviews.py

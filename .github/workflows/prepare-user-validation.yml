name: Prepare user validation package

on:
  push:
    branches:
      - feature/cycle3-full-extraction
    paths:
      - tools/prepare_user_validation_package.py
      - .github/workflows/prepare-user-validation.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare validation package
        run: python tools/prepare_user_validation_package.py

      - name: Confirm DATA is unchanged
        run: |
          if ! git diff --quiet -- DATA; then
            echo 'ERROR: DATA was modified.'
            git diff -- DATA
            exit 1
          fi

      - name: Commit validation package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/
          if git diff --cached --quiet; then
            echo "Validation package already current."
          else
            git commit -m "chore: prepare user validation package [skip ci]"
            git push
          fi

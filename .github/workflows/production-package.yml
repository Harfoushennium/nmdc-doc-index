name: Production Excel package

on:
  pull_request:
    branches: [master]
  push:
    branches: [08-excel-user-interface]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Regenerate real-data validation evidence
        run: |
          python profiler.py
          python sentinel_extract.py
          python full_extract.py
      - name: Verify real DATA baseline
        run: python tests/verify_cycle3_real_data.py
      - name: Confirm source DATA is unchanged
        run: git diff --exit-code -- DATA

  windows-engine-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build silent Windows engine
        run: >-
          pyinstaller --noconfirm --clean --onefile --name nmdc_index_engine
          --add-data "config;config" nmdc_index_engine.py
      - name: Smoke-test packaged engine
        shell: pwsh
        run: |
          .\dist\nmdc_index_engine.exe --help
          $testRoot = Join-Path $env:RUNNER_TEMP "nmdc-engine-smoke"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          .\dist\nmdc_index_engine.exe export-excel `
            --state-dir (Join-Path $testRoot "runtime") `
            --exchange-dir (Join-Path $testRoot "exchange") `
            --config-dir .\config
          if (-not (Test-Path (Join-Path $testRoot "exchange\dashboard.csv"))) {
            throw "Packaged engine did not create the Excel exchange."
          }
          if (-not (Test-Path (Join-Path $testRoot "exchange\source_selection.csv"))) {
            throw "Packaged engine did not create the Source Selection exchange."
          }
      - name: Assemble production package
        shell: pwsh
        run: |
          $package = "production-package"
          New-Item -ItemType Directory -Force -Path "$package\engine", "$package\config", "$package\vba", "$package\source" | Out-Null
          $workbookParts = @(Get-ChildItem .\excel\base_chunks\*.part* | Sort-Object Name)
          if ($workbookParts.Count -ne 10) { throw "Expected 10 production workbook chunks; found $($workbookParts.Count)." }
          $encodedWorkbook = ($workbookParts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ""
          $workbookBytes = [Convert]::FromBase64String($encodedWorkbook)
          if ($workbookBytes.Length -ne 6235717) { throw "Production workbook reconstruction has the wrong size: $($workbookBytes.Length) bytes." }
          $workbookPath = "$package\source\NMDC_Document_Index_Base.xlsx"
          [IO.File]::WriteAllBytes($workbookPath, $workbookBytes)
          $workbookHash = (Get-FileHash $workbookPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($workbookHash -ne "9225a41707c2dd483499a697d8358556364d42a2a35be9a09027f170c45f7682") {
            throw "Production workbook hash verification failed: $workbookHash"
          }
          Copy-Item .\dist\nmdc_index_engine.exe "$package\engine\nmdc_index_engine.exe"
          Copy-Item .\config\classification_rules.csv, .\config\project_identity_overrides.csv, .\config\source_exclusions.csv "$package\config\"
          Copy-Item .\excel\vba\*.bas "$package\vba\"
          Copy-Item .\excel\vba\*.cls "$package\vba\"
          Copy-Item .\excel\vba\*.frm, .\excel\vba\*.frx "$package\vba\"
          # REV03 Live Filter uses Cls_LiveFilter_Listener + modNMDC_LiveFilter.
          # Remove the superseded UserForm resources from the shipped package.
          Remove-Item "$package\vba\frmNMDC_LiveFilter.frm" -ErrorAction SilentlyContinue
          Remove-Item "$package\vba\frmNMDC_LiveFilter.frx" -ErrorAction SilentlyContinue
          Copy-Item .\packaging\Create_NMDC_Document_Index.vbs, .\packaging\README.md "$package\"
          Compress-Archive -Path "$package\*" -DestinationPath NMDC_Document_Index_Production_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NMDC-Document-Index-Production-Windows
          path: NMDC_Document_Index_Production_Windows.zip
          if-no-files-found: error

          } | Copy-Item -Destination "$package\vba\"
          Copy-Item .\packaging\Create_NMDC_Document_Index.vbs, .\packaging\README.md "$package\"
          Compress-Archive -Path "$package\*" -DestinationPath NMDC_Document_Index_Production_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NMDC-Document-Index-Production-Windows
          path: NMDC_Document_Index_Production_Windows.zip
          if-no-files-found: error
